<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /*FONT_FACES*/
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    position: relative;
  }
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 30%;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.72) 60%, rgba(0,0,0,0.85) 100%);
  }
  .text-block {
    position: absolute;
    left: 56px;
    right: 56px;
    bottom: 56px;
    color: #ffffff;
  }
  .title {
    font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
    font-size: 54px;
    font-weight: 400;
    line-height: 1.12;
    text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  .location {
    margin-top: 18px;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.5px;
    opacity: 0.92;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pin {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .brand {
    position: absolute;
    top: 48px;
    left: 64px;
    color: #ffffff;
    font-size: 30px;
    font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <img class="photo" id="photo" src="" alt="" />
  <div class="overlay"></div>
  <div class="brand" id="brand"></div>
  <div class="text-block">
    <div class="title" id="title"></div>
    <div class="location" id="location">
      <svg class="pin" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
      <span id="location-text"></span>
    </div>
  </div>
</body>
</html>
